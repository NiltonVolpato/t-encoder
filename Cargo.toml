[workspace]
resolver = "3"
members = ["apps", "firmware", "launcher", "ui", "espielberg", "tests", "protocol"]
# vendor/rust-enc is a submodule with its own [workspace] root. Its crates must
# stay members of THAT workspace so their `edition.workspace = true` /
# `[lints] workspace = true` inheritance resolves. We reach them by path
# dependency only.
exclude = ["vendor/rust-enc"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/NiltonVolpato/t-encoder"
publish = false

[workspace.dependencies]
# --- Upstream rust-enc crates (submodule, pinned) -------------------------
enc-config = { path = "vendor/rust-enc/enc-config" }
enc-co5300 = { path = "vendor/rust-enc/enc-co5300" }
enc-input = { path = "vendor/rust-enc/enc-input" }
enc-touch = { path = "vendor/rust-enc/enc-touch" }
enc-ui = { path = "vendor/rust-enc/enc-ui" }
enc-state = { path = "vendor/rust-enc/enc-state" }

# --- Pure / shared --------------------------------------------------------
# These MUST stay semver-compatible with vendor/rust-enc/Cargo.toml's
# [workspace.dependencies]. A mismatch builds two copies of esp-hal, which
# fails at link time. Bump both together, deliberately.
embedded-hal = "1"
embedded-hal-async = "1"
embedded-io-async = "0.7"
embedded-graphics = "0.8"
heapless = { version = "0.9", default-features = false }
static_cell = "2"
log = "0.4"
embedded-cli = "0.2.1"
embedded-io = "0.6"
ufmt = "0.2"

# --- ESP / Embassy device stack ------------------------------------------
# `float-save-restore` is a *default* feature, dropped here and re-added by
# firmware's own feature of the same name, so `just qemu` can build without it:
# QEMU's esp32s3 core has no FPU and the `rur.fcr` in xtensa-lx-rt's
# `save_context` takes qemu-system-xtensa down with it. Real builds keep it —
# enc-net asks for esp-hal's defaults anyway, so a radio build has it twice over.
esp-hal = { version = "1.1.1", default-features = false, features = ["esp32s3", "unstable", "rt", "exception-handler"] }
# `esp-radio` is deliberately NOT listed here — firmware's `radio` feature adds
# it, so `just qemu` can build a firmware with esp-radio out of the graph.
esp-rtos = { version = "0.3.0", features = ["embassy", "esp32s3", "esp-alloc"] }
esp-println = { version = "0.17.0", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-futures = "0.1"

# --- Radio + heap ---------------------------------------------------------
esp-alloc = { version = "0.10.0", features = ["esp32s3"] }
esp-radio = { version = "0.18.0", features = ["wifi", "ble", "coex", "esp-alloc", "esp32s3", "unstable"] }
# BLE host stack over esp-radio's `BleConnector`, which implements
# `bt_hci::transport::Transport`.
#
# These three versions are locked together and CANNOT be bumped independently:
# esp-radio 0.18 implements `Transport` for bt-hci **0.8**, and trouble-host
# tracks bt-hci one minor per release — 0.6 -> 0.8, 0.7 -> 0.9, 0.8 -> 0.10.
# Take trouble-host 0.7+ and `ExternalController<BleConnector>` stops satisfying
# trouble's `Controller` trait, because the two crates then speak different
# copies of bt-hci. Bump only alongside esp-radio.
#
# `security` is what makes HID-over-GATT work at all: hosts refuse to use a
# keyboard over an unencrypted link.
bt-hci = "0.8"
trouble-host = { version = "0.6", default-features = false, features = ["peripheral", "gatt", "security", "default-packet-pool", "default-packet-pool-mtu-255"] }

# --- Networking -----------------------------------------------------------
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "medium-ethernet", "tcp", "udp"] }

# --- Storage --------------------------------------------------------------
esp-storage = { version = "0.7", features = ["esp32s3"] }
embedded-storage = "0.3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "warn"
as_conversions = "warn"
allow_attributes = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"

# The submodule's own [profile.release] is IGNORED — only the root workspace's
# profiles apply. Replicated here; without this we silently ship a bloated build.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = "full"
# NOTE: a no-op for the firmware. `split-debuginfo` is a *target* capability,
# and `rustc --target xtensa-esp32s3-none-elf --print split-debuginfo` offers
# only `off` — there is no .dSYM or .dwp for the device binary, and none is
# possible. It still applies to host builds, which is why proc-macro dylibs get
# .dSYM bundles. Kept because it costs nothing and is right for the host half.
split-debuginfo = "packed"
# So `debug = "full"` above is generated and then discarded at link time.
# Measured at `opt-level = "s"` / `panic = "abort"`: 1.73 MiB stripped, 2.27 MiB
# with the symbol table (`strip = "debuginfo"`), 19.6 MiB with the DWARF.
# Nothing keeps an unstripped copy, so `just size` relinks with
# `CARGO_PROFILE_RELEASE_STRIP=none` when it needs symbols.
strip = "symbols"

# --- A ~240 KiB lever, deliberately not pulled ----------------------------
#
# `panic = "immediate-abort"` plus `cargo-features = ["panic-immediate-abort"]`
# as the first line of this file takes the binary from 1.73 to 1.49 MiB. It
# needs `-Zbuild-std`, which only the device recipes pass, so host builds are
# unaffected.
#
# The saving *is* the panic machinery, and that includes our own message:
# `panic!` compiles straight to an abort, `#[panic_handler]` is never called,
# and a panic dies silently. Verified with `strings` — "attempt to subtract with
# overflow", "index out of bounds" and even the `PANIC: ` literal from
# `firmware/src/main.rs` were all absent from the binary.
#
# Held in reserve rather than taken: ~240 KiB is worth roughly eight 88x88
# icons, which is a real amount of room, but not at the price of never learning
# why a panic happened. Reach for it if flash actually gets tight.

[profile.dev]
# The ESP toolchain prints a large banner on every unoptimized build telling you
# to use `--release`. rust-analyzer checks with the dev profile, so without this
# that banner lands in the editor's diagnostics on every save.
opt-level = 2

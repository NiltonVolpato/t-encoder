[workspace]
resolver = "3"
members = [
    "common",
    "lilygo_t_encoder_pro",
    "waveshare_knob_1_8",
]

[workspace.package]
edition      = "2024"
rust-version = "1.97"
publish      = false

[workspace.dependencies]
slint = {
    path = "../../forks/slint/api/rs/slint",
    default-features = false,
    features = [
        "compat-1-2",
        "unsafe-single-threaded",
        "libm",
        "renderer-software",
        "software-renderer-path",
    ]
}
i-slint-renderer-software = {
    path = "../../forks/slint/internal/renderers/software",
    default-features = false,
    features = ["experimental"],
}

esp-hal = { version = "~1.1.0", features = ["defmt", "esp32s3", "unstable"] }
esp-rtos = {
    version = "0.3.0",
    features = [
        "defmt",
        "embassy",
        "esp-alloc",
        "esp-radio",
        "esp32s3",
    ]
}
defmt = "1.0.1"
esp-alloc = { version = "0.10.0", features = ["defmt"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32s3"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embedded-hal-async = "1.0.0"
heapless = "0.8"
static_cell = "2.1"
critical-section = "1.2"
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }

app-launcher = { path = "../apps/launcher", default-features = false, features = ["apps"] }
app-shell = { path = "../crates/app-shell", default-features = false }
detent-decoder = { path = "../crates/detent-decoder" }
cst816 = { path = "../crates/cst816", features = ["defmt"] }
drv2605 = { path = "../crates/drv2605", features = ["defmt"] }
allocator-api2 = { version = "0.3", default-features = false, features = ["alloc"] }
common = { path = "common" }

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.dev]
opt-level = "z"
debug = "full"

[profile.release]
opt-level = 3
codegen-units = 1
debug = "full"
lto = "fat"

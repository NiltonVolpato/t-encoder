[package]
edition      = "2024"
name         = "lilygo_t_encoder_pro"
rust-version = "1.97"
version      = "0.1.0"

[[bin]]
name = "firmware"
path = "src/bin/main.rs"
test = false

[[test]]
harness = false
name    = "hello_test"

[lib]
test = false

[dependencies]
slint = {
    # version = "=1.17.1",
    path = "../../../forks/slint/api/rs/slint",
    default-features = false,
    features = [
        "compat-1-2",
        "unsafe-single-threaded",
        "libm",
        "renderer-software",
        "software-renderer-path",
    ]
}
app-launcher = { path = "../../apps/launcher", default-features = false, features = ["apps"] }
app-shell = { path = "../../crates/app-shell", default-features = false }

esp-hal = { version = "~1.1.0", features = ["defmt", "esp32s3", "unstable"] }

esp-rtos = {
    version = "0.3.0",
    features = [
        "defmt",
        "embassy",
        "esp-alloc",
        "esp-radio",
        "esp32s3",
    ]
}

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32s3"] }

embassy-net = {
    version = "0.9.1",
    features = [
        "defmt",
        "dhcpv4",
        "medium-ethernet",
        "tcp",
        "udp",
    ]
}
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { version = "0.10.0", features = ["defmt"] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
# for more networking protocol support see https://crates.io/crates/edge-net
bt-hci = "0.8.0"
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embedded-hal-async = "1.0.0"
heapless = "0.8"
esp-radio = {
    version = "0.18.0",
    features = [
        "ble",
        "coex",
        "defmt",
        "esp-alloc",
        "esp32s3",
        "unstable",
        "wifi",
    ]
}
smoltcp = {
    version = "0.13.0",
    default-features = false,
    features = [
        "defmt",
        "medium-ethernet",
        "multicast",
        "proto-dhcpv4",
        "proto-dns",
        "proto-ipv4",
        "socket-dns",
        "socket-icmp",
        "socket-raw",
        "socket-tcp",
        "socket-udp",
    ]
}
trouble-host = { version = "0.6.0", features = ["gatt"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
xtensa-lx        = "0.13.0"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
embedded-test = {
    version = "0.7.1",
    features = [
        "defmt",
        "embassy-010",
        "external-executor",
        "xtensa-semihosting",
    ]
}

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "z"
debug = "full"

[profile.release]
opt-level = 3
codegen-units = 1
debug = "full"
lto = "fat"

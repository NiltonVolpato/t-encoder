[env]
DEFMT_LOG="info"
ESP_HAL_CONFIG_DATA_CACHE_SIZE="64KB"
ESP_HAL_CONFIG_PLACE_SPI_MASTER_DRIVER_IN_RAM="true"
# ESP_HAL_CONFIG_INSTRUCTION_CACHE_SIZE="16KB"

[build]
target = "xtensa-esp32s3-none-elf"
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Wl,--no-warn-rwx-segments",
]

[unstable]
build-std = ["alloc", "core"]

[target.xtensa-esp32s3-none-elf]
runner = "probe-rs run --chip=esp32s3 --preverify --always-print-stacktrace --no-location"

[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The single Slint UI tree and its no_std platform glue. One runtime, shared by every app."

[dependencies]
# no_std MCU configuration. This is the ONLY place Slint is depended on, so the
# runtime, fonts and ICU data are linked exactly once for the whole firmware.
slint = { version = "1.17.1", default-features = false, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "libm",
    "renderer-software",
] }

[build-dependencies]
slint-build = "1.17.1"

[lints]
workspace = true

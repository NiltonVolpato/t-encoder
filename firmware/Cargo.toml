[package]
name = "firmware"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "T-Encoder-Pro app launcher — device firmware (xtensa-esp32s3 only)."

[dependencies]
# Ours.
launcher = { path = "../launcher" }
apps = { path = "../apps" }
ui = { path = "../ui" }
protocol = { path = "../protocol" }
# For the card model + colours only; the renderer lives in `ui`.
slint = { version = "1.17.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }

# Upstream drivers (vendor/rust-enc submodule).
enc-config = { workspace = true }
enc-co5300 = { workspace = true }
enc-input = { workspace = true }
enc-touch = { workspace = true }
enc-state = { workspace = true }
enc-net = { workspace = true, optional = true }

embedded-hal = { workspace = true }
embedded-graphics = { workspace = true }
# NOT the workspace's 0.8: trouble-host 0.6 is built on embassy-sync 0.7, and
# its GATT macros generate code against the *calling* crate's `embassy_sync`
# path with no way to override it. Nothing here crosses a crate boundary with an
# embassy-sync type, so this crate can sit on 0.7 while the esp stack stays on
# 0.8. Revisit when esp-radio and trouble-host agree again.
embassy-sync = "0.7"
embassy-futures = { workspace = true }
embassy-net = { workspace = true }
embedded-io-async = { workspace = true }
esp-hal = { workspace = true }
esp-rtos = { workspace = true }
esp-println = { workspace = true }
esp-bootloader-esp-idf = { workspace = true }
esp-storage = { workspace = true }
embedded-storage = { workspace = true }
esp-alloc = { workspace = true }
esp-radio = { workspace = true, optional = true }
bt-hci = { workspace = true, optional = true }
trouble-host = { workspace = true, optional = true }
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
log = { workspace = true }
embedded-io = { workspace = true }
heapless = { workspace = true }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[build-dependencies]
time = { version = "0.3.55", default-features = false, features = ["local-offset", "macros", "formatting"] }

[features]
default = ["radio", "float-save-restore"]

# esp-hal's own default, put back. Only `just qemu` leaves it out — see the
# esp-hal entry in the root Cargo.toml for why.
float-save-restore = ["esp-hal/float-save-restore"]

# Wi-Fi STA and the BLE HID keyboard. On for every real build; `just qemu`
# turns it off. QEMU emulates neither radio, and — the reason this is a cargo
# feature rather than a runtime branch — merely *depending* on esp-radio
# force-enables `xtensa-lx-rt/float-save-restore`, whose FPU context save
# crashes qemu-system-xtensa itself. `esp-rtos/esp-radio` is carried here
# rather than in the workspace dependency for the same reason.
radio = [
    "dep:enc-net",
    "dep:esp-radio",
    "dep:bt-hci",
    "dep:trouble-host",
    "esp-rtos/esp-radio",
]

# Lab-only: expose HTTP write endpoints (GET /toggle?i=N). Off by default.
http-write = ["radio", "enc-net/http-write"]

[lints]
workspace = true

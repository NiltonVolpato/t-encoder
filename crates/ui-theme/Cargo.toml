[package]
name = "ui-theme"
version = "0.1.0"
links = "theme"
edition.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
std = ["slint/std"]
simulator = ["std", "slint/renderer-software", "slint/backend-winit"]

[dependencies]
slint = { version = "1.17.1", default-features = false, features = ["compat-1-2"] }

[build-dependencies]
slint-build = { version = "1.17.1", features = ["experimental-module-builds"] }


[package]
name = "app-shell"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = [
    "theme/std",
    "slint/std",
    "critical-section/std",
]

[dependencies]
theme = { workspace = true }
critical-section = "1.2.0"
defmt = { workspace = true }

[dev-dependencies]
slint = { workspace = true }

[lints]
workspace = true

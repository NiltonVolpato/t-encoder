[package]
name = "app-magic8"
links = "app_magic8"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "magic8-simulator"
path = "src/bin/main.rs"

[features]
default = ["simulator"]
simulator = [
    "slint/renderer-software",
    "slint/software-renderer-path",
    "slint/backend-winit",
    "slint/std",
    "slint/mcp",
    "theme/std",
    "app-shell/std",
]

[dependencies]
slint = { workspace = true }
theme = { workspace = true }
app-shell = { workspace = true }

[build-dependencies]
baker = { workspace = true }

[lints]
workspace = true

[package]
name = "app-clock"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "clock-simulator"
path = "src/bin/main.rs"

[features]
default = ["simulator"]
simulator = ["slint/renderer-software", "slint/backend-winit", "slint/std", "ui-theme/std"]

[dependencies]
slint = { version = "1.17.1", default-features = false, features = ["compat-1-2"] }
ui-theme = { path = "../../crates/ui-theme", default-features = false }

[build-dependencies]
slint-build = "1.17.1"

# rust-analyzer needs the same treatment the Justfile gives cargo: the esp
# toolchain ships no precompiled `core` for xtensa-esp32s3-none-elf, so any
# check against the device target must build it from source. Without this,
# RA reports "can't find crate for `core`" on every file.
#
# Editor-agnostic: VS Code, Zed, Helix and neovim all read rust-analyzer.toml.

[cargo]
buildScripts.overrideCommand = [
    "cargo",
    "check",
    "-Zbuild-std=alloc,core",
    "-Zbuild-std-features=compiler-builtins-mem",
    "--target", "xtensa-esp32s3-none-elf",
    "--quiet",
    "--workspace",
    "--message-format=json",
    "--keep-going",
]

[cargo.extraEnv]
RUSTUP_TOOLCHAIN = "esp"

[check]
overrideCommand = [
    "cargo",
    "check",
    "-Zbuild-std=alloc,core",
    "-Zbuild-std-features=compiler-builtins-mem",
    "--target", "xtensa-esp32s3-none-elf",
    "--workspace",
    "--message-format=json",
]
allTargets = false
